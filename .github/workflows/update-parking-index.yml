name: Update Ticketmaster Parking Index

on:
  schedule:
    # Every day at 03:00 UTC
    - cron: "0 3 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-parking-index:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: feed-processor/package.json

      - name: Install feed processor
        working-directory: feed-processor
        run: npm install

      - name: Build parking index
        working-directory: feed-processor
        env:
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
          COUNTRY_CODE: US
          OUTPUT_FILE: ../data/parking.json
        run: node build-parking-index.js

      - name: Show generated index information
        run: |
          echo "Generated parking index:"
          wc -c data/parking.json
          echo ""
          head -40 data/parking.json

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet -- data/parking.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit parking index
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/parking.json

          git commit \
            -m "Update Ticketmaster parking index"

          git push

      - name: No changes
        if: steps.changes.outputs.changed == 'false'
        run: |
          echo "Parking index did not change."